      <stop offset="1" stop-color="#27372a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f278"/>
      <stop offset="1" stop-color="#91b83a"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#a7cd45" stop-opacity=".23"/>
      <stop offset="1" stop-color="#a7cd45" stop-opacity="0"/>
    </radialGradient>
  </defs>
