<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">CirclePot — Rotating savings on Portaldot V3</title>
  <desc id="desc">A dark green banner showing a transparent savings circle, three member seats, and a scheduled payout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
