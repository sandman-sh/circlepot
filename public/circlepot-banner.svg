  <circle cx="1130" cy="182" r="13" fill="url(#glow)"/>
  <circle cx="1234" cy="259" r="13" fill="url(#glow)"/>
  <circle cx="1130" cy="338" r="13" fill="url(#glow)"/>
  <circle cx="1130" cy="259" r="38" fill="#d9f278"/>
